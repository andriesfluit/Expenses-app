name: Publiceren naar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; een nieuwere push verdringt een lopende build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controleer of GitHub Pages klaarstaat
        # De publiceer-stap draait in een aparte omgeving. Wordt die geweigerd,
        # dan krijgt hij geen machine toegewezen en dus ook geen logboek: je
        # ziet alleen "failure" zonder reden. Deze stap vraagt de instelling op
        # terwijl er nog wel een logboek is, en zegt precies wat eraan mankeert.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo "000")

          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages staat uit voor deze repository."
            echo "Zet het aan: Settings > Pages > Build and deployment > Source > GitHub Actions."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Kon de Pages-instelling niet opvragen (HTTP $code)."
            cat /tmp/pages.json
            exit 1
          fi

          soort=$(jq -r '.build_type // "leeg"' /tmp/pages.json)
          if [ "$soort" != "workflow" ]; then
            echo "::error::Pages publiceert nu via '$soort' in plaats van via Actions."
            echo "Zet Settings > Pages > Source op 'GitHub Actions' en niet op 'Deploy from a branch'."
            exit 1
          fi

          echo "Pages staat aan en publiceert via Actions."
          echo "Adres: $(jq -r '.html_url' /tmp/pages.json)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint en tests
        run: npm run check

      - name: Controleer of de Supabase-secrets bestaan
        # Zonder deze stap bouwt de app gewoon door met lokale opslag. Ze zou
        # dan werken op ieders telefoon, maar niemand zou de uitgaven van de
        # anderen zien - een fout die je pas op vakantie ontdekt.
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          SLEUTEL: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          ontbreekt=0
          if [ -z "$URL" ]; then
            echo "::error::Secret VITE_SUPABASE_URL ontbreekt."
            ontbreekt=1
          fi
          if [ -z "$SLEUTEL" ]; then
            echo "::error::Secret VITE_SUPABASE_ANON_KEY ontbreekt."
            ontbreekt=1
          fi
          if [ "$ontbreekt" = "1" ]; then
            echo "::error::Zet ze onder Settings > Secrets and variables > Actions."
            echo "Zonder die twee zou de gepubliceerde app op lokale opslag draaien"
            echo "en zou niemand elkaars uitgaven zien."
            exit 1
          fi
          echo "Beide secrets aanwezig."

      - name: Bouwen
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TRIP_ID: ${{ vars.VITE_TRIP_ID || 'vakantie' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Controleer dat de gedeelde opslag in de bundle zit
        # Laatste vangnet: staat de project-URL niet in de uitvoer, dan is er
        # iets misgegaan met de secrets en publiceren we beter niets.
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::De gebouwde app bevat geen Supabase-URL."
            exit 1
          fi
          echo "Gedeelde opslag zit in de bundle."

      # Zonder 404.html geeft Pages bij een verkeerde URL zijn eigen foutpagina.
      - name: Val terug op de app bij een onbekend pad
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - id: publicatie
        uses: actions/deploy-pages@v4
